# ============================================================
# Hospital Readmission Analytics and Prediction
# Docker Compose Configuration
#
# Services:
#   - postgres    : PostgreSQL 16 database
#   - mlflow      : MLflow tracking server
#   - airflow-init: Airflow database initialisation (one-shot)
#   - airflow-web : Airflow web UI
#   - airflow-sched: Airflow scheduler
#   - fastapi     : Prediction API
#   - streamlit   : Analytics dashboard
#
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker-compose up --build
#   3. Open http://localhost:8501 for dashboard
#      Open http://localhost:8000/docs for API docs
#      Open http://localhost:5000 for MLflow
#      Open http://localhost:8080 for Airflow
# ============================================================

version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=''
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./.env:/opt/airflow/.env
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ----------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hospital_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_readmission}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------
  # MLflow Tracking Server
  # ----------------------------------------------------------
  mlflow:
    image: python:3.11-slim
    container_name: hospital_mlflow
    command: >
      bash -c "pip install mlflow==2.13.0 psycopg2-binary==2.9.9 &&
               mlflow server
               --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
               --default-artifact-root /mlartifacts
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------
  # Airflow - Database Init (runs once)
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: hospital_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@hospital.local \
          --password admin
    restart: "no"

  # ----------------------------------------------------------
  # Airflow Web Server
  # ----------------------------------------------------------
  airflow-web:
    <<: *airflow-common
    container_name: hospital_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  # Airflow Scheduler
  # ----------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: hospital_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  # FastAPI Prediction API
  # ----------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hospital_fastapi
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------
  # Streamlit Dashboard
  # ----------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: hospital_streamlit
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  mlflow_artifacts:
    driver: local
